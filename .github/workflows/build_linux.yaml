name: Build Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          build-cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install build-essential cmake git clang libx11-dev -y

      - name: Configure
        run: xmake f -m release -p linux --vasset_build_examples=y --vasset_build_tests=y --policies=build.ccache:y -y

      - name: Build
        run: xmake repo -u && xmake -vD -y

      - name: Run unit tests
        run: xmake run test-c-api

      - name: Run serialization tests
        run: xmake run test-binary-serialization

      - name: Run importer readback tests
        run: xmake run test-importers

      - name: Install package
        run: xmake install -y -o install-check

      - name: Verify installed archives and headers
        run: xmake lua tests/check_install.lua install-check importers

      - name: Show install error log
        if: failure()
        run: |
          find /home/runner/.xmake/cache -name install.txt -exec echo "==== {} ====" \; -exec cat {} \;
